<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Kedai Kopi</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div>
      <p class="eyebrow">PANEL OUTLET</p>
      <h1>Kedai Kopi</h1>
    </div>
    <span id="connection-status" class="connection offline" role="status">Menghubungkan...</span>
  </header>

  <div id="error-banner" class="error-banner" role="alert" hidden></div>

  <nav class="tab-bar" aria-label="Menu admin">
    <button class="tab active" data-tab="cashier-panel">Kasir</button>
    <button class="tab" data-tab="orders-panel">Pesanan <span id="order-count" class="count">0</span></button>
    <button class="tab" data-tab="sales-panel">Penjualan</button>
    <button class="tab" data-tab="menu-panel">Menu</button>
  </nav>

  <main>
    <section id="cashier-panel" class="panel active">
      <div class="section-heading">
        <div><p class="eyebrow">BUAT PESANAN</p><h2>Pilih menu</h2></div>
      </div>
      <div id="product-grid" class="product-grid"></div>
      <aside class="cart-card">
        <div class="section-heading"><h2>Keranjang</h2><strong id="cart-total">Rp0</strong></div>
        <div id="cart-items" class="cart-items"><p class="empty-state">Belum ada menu dipilih.</p></div>
        <div class="payment-grid" role="group" aria-label="Metode pembayaran">
          <button class="payment active" data-payment="cash">Tunai</button>
          <button class="payment" data-payment="QRIS">QRIS</button>
        </div>
        <button id="checkout" class="primary action-button" disabled>Sudah Dibayar</button>
      </aside>
    </section>

    <section id="orders-panel" class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">ANTREAN HARI INI</p><h2>Pesanan aktif</h2></div>
        <button id="reset-queue" class="danger ghost action-button">Reset</button>
      </div>
      <div id="orders-list" class="orders-list"></div>
    </section>

    <section id="sales-panel" class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">HARI INI</p><h2>Catatan penjualan</h2></div>
      </div>
      <div class="sales-summary">
        <article class="sales-card featured"><span>Omzet</span><strong id="sales-revenue">Rp0</strong></article>
        <article class="sales-card"><span>Transaksi</span><strong id="sales-count">0</strong></article>
        <article class="sales-card"><span>Tunai</span><strong id="sales-cash">Rp0</strong></article>
        <article class="sales-card"><span>QRIS</span><strong id="sales-qris">Rp0</strong></article>
      </div>
      <div class="sales-columns">
        <section class="sales-section">
          <h3>Produk terjual</h3>
          <div id="sold-products" class="sold-products"></div>
        </section>
        <section class="sales-section">
          <h3>Transaksi</h3>
          <div id="sales-list" class="sales-list"></div>
        </section>
      </div>
    </section>

    <section id="menu-panel" class="panel">
      <div class="section-heading"><div><p class="eyebrow">PENGATURAN</p><h2>Daftar menu</h2></div></div>
      <form id="product-form" class="product-form">
        <input type="hidden" id="product-id">
        <label>Nama menu<input id="product-name" required maxlength="60" placeholder="Contoh: Kopi Susu"></label>
        <label>Kategori<input id="product-category" required maxlength="40" placeholder="Kopi"></label>
        <label>Harga<input id="product-price" required type="number" min="0" step="1000" inputmode="numeric" placeholder="18000"></label>
        <div class="form-actions">
          <button type="button" id="cancel-edit" class="ghost" hidden>Batal</button>
          <button type="submit" class="primary action-button">Simpan menu</button>
        </div>
      </form>
      <div id="menu-list" class="menu-list"></div>
    </section>
  </main>

  <div id="success-toast" class="toast" role="status" hidden></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
